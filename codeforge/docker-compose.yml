version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: codeforge-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: codeforge
    ports:
      - "5433:5432"

  redis:
    image: redis:7
    container_name: codeforge-redis
    restart: always
    ports:
      - "6379:6379"
