version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: codeforge-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"

  redis:
    image: redis:7
    container_name: codeforge-redis
    restart: always
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
